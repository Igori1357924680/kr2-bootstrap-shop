<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Оформление заявки на сайте PlayTable (Bootstrap).">
  <title>Оформление заявки — PlayTable</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Навигация -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">PlayTable</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
          <li class="nav-item"><a class="nav-link" href="product.html">Товар</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="order.html">Заявка</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1 py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          
          <h1 class="mb-4 text-center">Оформление заявки</h1>
          
          <!-- Сообщение пользователю (Alert) -->
          <div class="alert alert-info mb-4" role="alert">
            Пожалуйста, заполните форму, и мы свяжемся с вами в течение 15 минут.
          </div>

          <!-- Форма -->
          <form class="bg-white p-4 rounded shadow-sm border">
            
            <!-- Поле: Имя (form-control) -->
            <div class="mb-3">
              <label for="name" class="form-label">Имя</label>
              <input type="text" class="form-control" id="name" name="name" placeholder="Ваше имя" required>
            </div>

            <!-- Поле: Email (input-group) -->
            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <div class="input-group">
                <span class="input-group-text">@</span>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
              </div>
            </div>

            <!-- Поле: Телефон -->
            <div class="mb-3">
              <label for="phone" class="form-label">Телефон</label>
              <input type="tel" class="form-control" id="phone" name="phone" placeholder="+7 (999) 000-00-00" required>
            </div>

            <!-- Поле: Тема (form-select) -->
            <div class="mb-3">
              <label for="topic" class="form-label">Тема заявки</label>
              <select class="form-select" id="topic" name="topic" required>
                <option value="" selected disabled>Выберите тему</option>
                <option value="smartphone">Смартфон</option>
                <option value="audio">Наушники</option>
                <option value="watch">Умные часы</option>
                <option value="accessory">Аксессуар</option>
              </select>
            </div>

            <!-- Поле: Комментарий -->
            <div class="mb-3">
              <label for="comment" class="form-label">Комментарий</label>
              <textarea class="form-control" id="comment" name="comment" rows="3" placeholder="Дополнительная информация..."></textarea>
            </div>

            <!-- Чекбокс (form-check) -->
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
              <label class="form-check-label" for="agree">
                Согласен на обработку персональных данных
              </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg">Отправить заявку</button>
          </form>

        </div>
      </div>
    </div>
  </main>

  <!-- Подвал -->
  <footer class="bg-dark text-light py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0">© 2026 PlayTable. Контрольная работа №2 (Bootstrap).</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
